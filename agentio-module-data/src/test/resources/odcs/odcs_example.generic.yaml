#
# Engine-neutral conversion of odcs_example.postgres.yaml, the ODCS project's PostgreSQL AdventureWorks contract
# https://bitol-io.github.io/open-data-contract-standard/latest/examples/all/postgresql-adventureworks-contract/
# Same objects, properties, descriptions, keys and metadata; three kinds of change:
#
# 1. Each property's PostgreSQL physicalType is removed and replaced by the logicalType it implies.
#    The original's logicalType came from ODCS v3.0.0, which has no timestamp or time and was given
#    'number' for integers and 'object' for the AdventureWorks domains.
#      serial, int4         -> integer             numeric      -> number
#      int2                 -> integer, i16        timestamp    -> timestamp
#      varchar[n]           -> string, maxLength n (n = 2147483647: no maxLength)
#      text, xml, bpchar    -> string              date         -> date
#      uuid                 -> string, uuid        time         -> time
#      bytea                -> string, binary
#      AdventureWorks domains (CREATE DOMAIN in its PostgreSQL schema):
#      Name -> string, maxLength 50; Phone, OrderNumber -> 25; AccountNumber -> 15; Flag, NameStyle -> boolean
# 2. Composite primary keys get primaryKeyPosition in declaration order, the only order the original
#    gives; the key columns, and so what the key makes unique, are unchanged.
# 3. apiVersion is v3.1.0, the first with the timestamp and time logical types.
#
# OdcsExampleConversionTest checks every one of these against odcs_example.postgres.yaml.

